[package]
name = "trebuchet-pairs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Fully collateralized leveraged long/short pools for any Solana token, with on-chain resting offers as the order book"
repository = "https://github.com/staccDOTsol/Trebuchet"

[features]
no-entrypoint = []
test-sbf = []

[dependencies]
solana-program = "=4.0.0"
solana-system-interface = { version = "3", features = ["bincode"] }
thiserror = "2.0"
uint = "0.10"

[dev-dependencies]
solana-program-test = { version = "=4.2.2", features = ["agave-unstable-api"] }
solana-sdk = "4.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lib]
crate-type = ["cdylib", "lib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
